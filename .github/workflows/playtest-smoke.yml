name: TechOps Playtest Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JavaScript syntax
        run: |
          node --check game.js
          if [ -f ux.js ]; then node --check ux.js; fi
          if [ -f lab.js ]; then node --check lab.js; fi
          if [ -f refresh.js ]; then node --check refresh.js; fi

      - name: Install browser test runtime
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run First Shift campaign smoke
        run: |
          if [ -f tests/smoke_test.py ]; then python tests/smoke_test.py; fi

      - name: Run Core 1 Computer Lab smoke
        run: |
          if [ -f tests/core1_lab_test.py ]; then python tests/core1_lab_test.py; fi

      - name: Run Technician Refresh smoke
        run: |
          if [ -f tests/refresh_mode_test.py ]; then python tests/refresh_mode_test.py; fi
