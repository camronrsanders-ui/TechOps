name: TechOps Playtest Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  eight-mission-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JavaScript syntax
        run: node --check game.js

      - name: Install browser test runtime
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run all eight incidents when playtest test is present
        run: |
          if [ -f tests/smoke_test.py ]; then
            python tests/smoke_test.py
          else
            echo "No playtest smoke file in this branch; syntax validation only."
          fi
